services:
  bili-gallery:
    image: zzs-bili-gallery:12.1-amd64
    container_name: bili-gallery
    restart: unless-stopped
    user: "0:0"
    init: true
    shm_size: 512mb
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, FOWNER, DAC_OVERRIDE, KILL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./xhs_worker/seccomp_profile.json

    ports:
      - "7860:7860"

    environment:
      - APP_REPO_ROOT=/workspace
      - APP_STORAGE_ROOT=/storage
      - APP_THUMBNAIL_WORKERS=1
      - TZ=Asia/Shanghai

    volumes:
      - /tmp/zfsv3/nvme12/15824368694/data/Docker/bili-gallery/config:/storage/config
      - /tmp/zfsv3/nvme12/15824368694/data/Docker/bili-gallery/data:/storage/data
