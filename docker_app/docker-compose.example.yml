services:
  bili-gallery:
    build:
      context: ..
      dockerfile: docker_app/Dockerfile
    ports:
      - "7860:7860"
    environment:
      APP_REPO_ROOT: /workspace
      APP_STORAGE_ROOT: /workspace/storage
    volumes:
      - ..:/workspace
    restart: unless-stopped
    init: true
    shm_size: 512mb
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, FOWNER, DAC_OVERRIDE, KILL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./xhs_worker/seccomp_profile.json
