services:
  bili-gallery:
    environment:
      XHS_WORKER_URL: http://xhs-worker:8091
      XHS_WORKER_TOKEN_FILE: /run/secrets/xhs_worker_token
    secrets:
      - xhs_worker_token
    networks: [default, xhs-internal]

  xhs-worker:
    profiles: [xhs]
    image: zzs-xhs-worker:10.6-amd64
    build:
      context: ..
      dockerfile: docker_app/xhs_worker/Dockerfile
    init: true
    restart: unless-stopped
    user: "1000:1000"
    shm_size: 512mb
    mem_limit: 2g
    cap_drop: [ALL]
    security_opt:
      - seccomp=./xhs_worker/seccomp_profile.json
    ports:
      - "127.0.0.1:6080:6080"
    environment:
      DISPLAY: :99
      TZ: Asia/Shanghai
      XHS_WORKER_TOKEN_FILE: /run/secrets/xhs_worker_token
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
    volumes:
      - xhs-private:/var/lib/xhs
    secrets:
      - xhs_worker_token
    networks: [xhs-internal, xhs-egress]

secrets:
  xhs_worker_token:
    file: ../.secrets/xhs_worker_token

volumes:
  xhs-private:

networks:
  default:
  xhs-internal:
    internal: true
  xhs-egress:
